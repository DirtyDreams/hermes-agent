[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "notebook-lm"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "notebooklm-py>=0.3.0",
    "pyyaml>=6.0",
]

[project.scripts]
notebook-lm = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
